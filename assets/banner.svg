<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ffb3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)" rx="12"/>

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="0.5">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="150" y1="0" x2="150" y2="200"/>
    <line x1="300" y1="0" x2="300" y2="200"/>
    <line x1="450" y1="0" x2="450" y2="200"/>
    <line x1="600" y1="0" x2="600" y2="200"/>
    <line x1="750" y1="0" x2="750" y2="200"/>
  </g>

  <!-- Glowing accent line -->
  <line x1="60" y1="145" x2="540" y2="145" stroke="url(#textGrad)" stroke-width="1.5" opacity="0.5" filter="url(#glow)"/>

  <!-- Terminal dots (decorative) -->
  <circle cx="72" cy="60" r="6" fill="#ff5f57"/>
  <circle cx="92" cy="60" r="6" fill="#febc2e"/>
  <circle cx="112" cy="60" r="6" fill="#28c840"/>

  <!-- Terminal box (decorative) -->
  <rect x="60" y="45" width="200" height="100" rx="6" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.7"/>
  <text x="72" y="90" font-family="monospace" font-size="11" fill="#00d4ff" opacity="0.9">$ ssh user@homelab</text>
  <text x="72" y="108" font-family="monospace" font-size="11" fill="#00ffb3" opacity="0.8">Welcome to Debian!</text>
  <text x="72" y="126" font-family="monospace" font-size="11" fill="#4ade80" opacity="0.7">● PM2   ● Nginx   ● Running</text>

  <!-- Main Title -->
  <text x="300" y="85" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="800"
        fill="url(#textGrad)" filter="url(#glow)" text-anchor="middle">HomeLab</text>

  <!-- Subtitle -->
  <text x="300" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400"
        fill="#8ab4d4" text-anchor="middle" letter-spacing="2">SELF-HOSTED SERVER INFRASTRUCTURE</text>

  <!-- Badge pills -->
  <rect x="125" y="155" width="75" height="22" rx="11" fill="#1a2744" stroke="#00d4ff" stroke-width="0.8" opacity="0.9"/>
  <text x="162" y="170" font-family="monospace" font-size="10" fill="#00d4ff" text-anchor="middle">Debian Linux</text>

  <rect x="210" y="155" width="65" height="22" rx="11" fill="#1a2744" stroke="#00ffb3" stroke-width="0.8" opacity="0.9"/>
  <text x="242" y="170" font-family="monospace" font-size="10" fill="#00ffb3" text-anchor="middle">Tailscale</text>

  <rect x="285" y="155" width="50" height="22" rx="11" fill="#1a2744" stroke="#f97316" stroke-width="0.8" opacity="0.9"/>
  <text x="310" y="170" font-family="monospace" font-size="10" fill="#f97316" text-anchor="middle">Nginx</text>

  <rect x="345" y="155" width="40" height="22" rx="11" fill="#1a2744" stroke="#4ade80" stroke-width="0.8" opacity="0.9"/>
  <text x="365" y="170" font-family="monospace" font-size="10" fill="#4ade80" text-anchor="middle">PM2</text>

  <rect x="395" y="155" width="70" height="22" rx="11" fill="#1a2744" stroke="#86efac" stroke-width="0.8" opacity="0.9"/>
  <text x="430" y="170" font-family="monospace" font-size="10" fill="#86efac" text-anchor="middle">Node.js</text>

  <!-- Right side decorative dots / nodes -->
  <circle cx="700" cy="70" r="5" fill="#00d4ff" opacity="0.6" filter="url(#glow)"/>
  <circle cx="760" cy="100" r="4" fill="#00ffb3" opacity="0.5" filter="url(#glow)"/>
  <circle cx="820" cy="60" r="3" fill="#00d4ff" opacity="0.4"/>
  <circle cx="840" cy="130" r="5" fill="#f97316" opacity="0.4"/>
  <circle cx="780" cy="150" r="3" fill="#00ffb3" opacity="0.3"/>

  <!-- Connecting lines for nodes -->
  <line x1="700" y1="70" x2="760" y2="100" stroke="#00d4ff" stroke-width="0.8" opacity="0.3"/>
  <line x1="760" y1="100" x2="820" y2="60" stroke="#00ffb3" stroke-width="0.8" opacity="0.3"/>
  <line x1="760" y1="100" x2="840" y2="130" stroke="#00d4ff" stroke-width="0.8" opacity="0.25"/>
  <line x1="840" y1="130" x2="780" y2="150" stroke="#00ffb3" stroke-width="0.8" opacity="0.25"/>
</svg>
