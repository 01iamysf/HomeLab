<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080c18"/>
      <stop offset="100%" style="stop-color:#0c1a2e"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00ffb3"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1f33"/>
      <stop offset="100%" style="stop-color:#091525"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="220" fill="url(#bg)" rx="14"/>

  <!-- Subtle dot grid -->
  <g opacity="0.04">
    <line x1="0" y1="44" x2="960" y2="44" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="0" y1="88" x2="960" y2="88" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="0" y1="132" x2="960" y2="132" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="0" y1="176" x2="960" y2="176" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="192" y1="0" x2="192" y2="220" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="384" y1="0" x2="384" y2="220" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="576" y1="0" x2="576" y2="220" stroke="#00d4ff" stroke-width="0.6"/>
    <line x1="768" y1="0" x2="768" y2="220" stroke="#00d4ff" stroke-width="0.6"/>
  </g>

  <!-- ═══════════════════════════════════════ -->
  <!-- LEFT: Terminal window  (x: 28 to 248)  -->
  <!-- ═══════════════════════════════════════ -->

  <!-- Terminal outer frame -->
  <rect x="28" y="30" width="210" height="158" rx="8" fill="url(#termBg)" stroke="#1e3d60" stroke-width="1.2"/>

  <!-- Title bar -->
  <rect x="28" y="30" width="210" height="28" rx="8" fill="#112030"/>
  <rect x="28" y="44" width="210" height="14" fill="#112030"/>

  <!-- Traffic light dots -->
  <circle cx="48" cy="44" r="5.5" fill="#ff5f57"/>
  <circle cx="66" cy="44" r="5.5" fill="#febc2e"/>
  <circle cx="84" cy="44" r="5.5" fill="#28c840"/>

  <!-- Window title -->
  <text x="139" y="49" font-family="monospace" font-size="9" fill="#4a7fa5" text-anchor="middle" opacity="0.8">bash — homelab</text>

  <!-- Terminal content -->
  <text x="44" y="82" font-family="monospace" font-size="10.5" fill="#4a7fa5" opacity="0.7">user@debian-server:~$</text>
  <text x="44" y="99" font-family="monospace" font-size="10.5" fill="#00d4ff" opacity="0.95">ssh user@homelab</text>
  <text x="44" y="116" font-family="monospace" font-size="10" fill="#00ffb3" opacity="0.8">Welcome to Debian GNU/Linux</text>
  <text x="44" y="133" font-family="monospace" font-size="10" fill="#4ade80" opacity="0.75">● tailscaled   active</text>
  <text x="44" y="149" font-family="monospace" font-size="10" fill="#4ade80" opacity="0.75">● nginx        active</text>
  <text x="44" y="165" font-family="monospace" font-size="10" fill="#4ade80" opacity="0.75">● pm2          active</text>

  <!-- Blinking cursor -->
  <rect x="44" y="172" width="7" height="11" fill="#00d4ff" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- ════════════════════════════════════════════ -->
  <!-- CENTER: Title + Subtitle + Badges (288–672)  -->
  <!-- ════════════════════════════════════════════ -->

  <!-- Accent line above title -->
  <line x1="310" y1="62" x2="650" y2="62" stroke="url(#titleGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Main title -->
  <text x="480" y="118" font-family="'Segoe UI', 'Arial Black', Arial, sans-serif"
        font-size="58" font-weight="900" fill="url(#titleGrad)"
        text-anchor="middle" filter="url(#glow)">HomeLab</text>

  <!-- Subtitle -->
  <text x="480" y="142" font-family="'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="400" fill="#6a9bbf"
        text-anchor="middle" letter-spacing="3.5">SELF-HOSTED SERVER INFRASTRUCTURE</text>

  <!-- Accent line below subtitle -->
  <line x1="310" y1="155" x2="650" y2="155" stroke="url(#titleGrad)" stroke-width="1" opacity="0.3"/>

  <!-- Badge pills — evenly spaced below subtitle -->
  <!-- Debian Linux -->
  <rect x="303" y="168" width="84" height="22" rx="11" fill="#0d1f33" stroke="#00d4ff" stroke-width="0.9"/>
  <text x="345" y="183" font-family="monospace" font-size="9.5" fill="#00d4ff" text-anchor="middle">Debian Linux</text>

  <!-- Tailscale -->
  <rect x="397" y="168" width="66" height="22" rx="11" fill="#0d1f33" stroke="#00ffb3" stroke-width="0.9"/>
  <text x="430" y="183" font-family="monospace" font-size="9.5" fill="#00ffb3" text-anchor="middle">Tailscale</text>

  <!-- Nginx -->
  <rect x="474" y="168" width="52" height="22" rx="11" fill="#0d1f33" stroke="#f97316" stroke-width="0.9"/>
  <text x="500" y="183" font-family="monospace" font-size="9.5" fill="#f97316" text-anchor="middle">Nginx</text>

  <!-- PM2 -->
  <rect x="536" y="168" width="42" height="22" rx="11" fill="#0d1f33" stroke="#a78bfa" stroke-width="0.9"/>
  <text x="557" y="183" font-family="monospace" font-size="9.5" fill="#a78bfa" text-anchor="middle">PM2</text>

  <!-- Node.js -->
  <rect x="588" y="168" width="60" height="22" rx="11" fill="#0d1f33" stroke="#4ade80" stroke-width="0.9"/>
  <text x="618" y="183" font-family="monospace" font-size="9.5" fill="#4ade80" text-anchor="middle">Node.js</text>

  <!-- ════════════════════════════════════════ -->
  <!-- RIGHT: Network node decoration (712–932) -->
  <!-- ════════════════════════════════════════ -->

  <!-- Node circles -->
  <circle cx="760" cy="68" r="6" fill="#00d4ff" opacity="0.7" filter="url(#softglow)"/>
  <circle cx="840" cy="95" r="5" fill="#00ffb3" opacity="0.6" filter="url(#softglow)"/>
  <circle cx="900" cy="58" r="4" fill="#00d4ff" opacity="0.45"/>
  <circle cx="920" cy="140" r="6" fill="#f97316" opacity="0.45" filter="url(#softglow)"/>
  <circle cx="856" cy="158" r="4" fill="#00ffb3" opacity="0.4"/>
  <circle cx="786" cy="140" r="3.5" fill="#a78bfa" opacity="0.5"/>
  <circle cx="930" cy="90" r="3" fill="#4ade80" opacity="0.4"/>

  <!-- Connecting mesh lines -->
  <line x1="760" y1="68"  x2="840" y2="95"  stroke="#00d4ff" stroke-width="0.9" opacity="0.25"/>
  <line x1="840" y1="95"  x2="900" y2="58"  stroke="#00ffb3" stroke-width="0.9" opacity="0.22"/>
  <line x1="900" y1="58"  x2="930" y2="90"  stroke="#00d4ff" stroke-width="0.8" opacity="0.18"/>
  <line x1="840" y1="95"  x2="920" y2="140" stroke="#00d4ff" stroke-width="0.9" opacity="0.22"/>
  <line x1="920" y1="140" x2="856" y2="158" stroke="#00ffb3" stroke-width="0.8" opacity="0.2"/>
  <line x1="856" y1="158" x2="786" y2="140" stroke="#a78bfa" stroke-width="0.8" opacity="0.2"/>
  <line x1="786" y1="140" x2="760" y2="68"  stroke="#00d4ff" stroke-width="0.8" opacity="0.18"/>
  <line x1="930" y1="90"  x2="920" y2="140" stroke="#4ade80" stroke-width="0.7" opacity="0.16"/>

  <!-- Small glow halos on key nodes -->
  <circle cx="760" cy="68"  r="12" fill="none" stroke="#00d4ff" stroke-width="0.5" opacity="0.15"/>
  <circle cx="840" cy="95"  r="10" fill="none" stroke="#00ffb3" stroke-width="0.5" opacity="0.12"/>
  <circle cx="920" cy="140" r="12" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.12"/>

</svg>
